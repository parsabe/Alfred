[project]
name = "alfred-desktop"
version = "0.1.0"
description = "Alfred on your computer: hands-free voice, chat and app window, connected to your Alfred server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
    "httpx>=0.27",
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[project.scripts]
alfred = "alfred_desktop.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.10", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alfred_desktop"]

[tool.ruff]
line-length = 100
target-version = "py310"
