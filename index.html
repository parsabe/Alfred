<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Alfred</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Cpath d='M6 33 Q32 6 58 33' stroke='%23ff7a1a' stroke-width='5' fill='none'/%3E%3Cpath d='M6 33 Q32 56 58 33' stroke='%23206cff' stroke-width='5' fill='none'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alfred">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="Alfred. Say Alfred, or tap or press space to speak.">
    <canvas id="ribbon" aria-hidden="true"></canvas>

    <div id="captions" aria-live="polite">
      <p id="you" class="caption you"></p>
      <p id="alfred" class="caption alfred"></p>
    </div>

    <p id="hint" class="hint">Tap anywhere to speak</p>
    <p id="status" class="status" role="status"></p>
  </main>

  <nav class="corner top-right">
    <button id="settings-btn" class="icon" aria-label="Settings" title="Settings (,)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </nav>

  <nav class="corner bottom-right">
    <button id="keyboard-btn" class="icon" aria-label="Type instead" title="Type (/)">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
  </nav>

  <form id="type-form" class="type-form" hidden>
    <input id="type-input" type="text" autocomplete="off" placeholder="Write to Alfred…" aria-label="Message">
  </form>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="sheet">
      <h2 id="settings-title">Alfred</h2>

      <label class="field">
        <span>Server</span>
        <input id="server" type="url" autocomplete="off" spellcheck="false" inputmode="url">
        <small>Leave empty to use the server this page came from.</small>
      </label>
      <label class="field">
        <span>Access token</span>
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="ALFRED_API_TOKEN">
        <small>Stays on this device only.</small>
      </label>

      <label class="toggle"><input id="opt-handsfree" type="checkbox" checked>
        <span>Hands-free <small>answer whenever someone says “Alfred, …”</small></span></label>
      <label class="toggle"><input id="opt-voice" type="checkbox" checked>
        <span>Alfred speaks</span></label>
      <label class="toggle"><input id="opt-captions" type="checkbox" checked>
        <span>Captions</span></label>
      <label class="toggle"><input id="opt-awake" type="checkbox" checked>
        <span>Keep the screen on <small>so Alfred keeps listening on phones and tablets</small></span></label>

      <p id="server-info" class="server-info"></p>

      <div class="actions">
        <button type="button" id="stop-listening" class="quiet">Stop listening</button>
        <button type="button" id="new-conversation" class="quiet">New conversation</button>
        <button value="close" class="primary">Done</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
