# Alternative to deploy/install.sh: Alfred and Ollama (Gemma) in containers.
#   docker compose up -d --build
#   docker compose exec ollama ollama pull gemma3:12b
services:
  alfred:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/alfred.db
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
      MODELS_DIR: /app/data/models
      HF_HOME: /app/data/models/hf
    depends_on: [ollama]
    ports:
      - "127.0.0.1:8000:8000"   # put Tailscale/Caddy in front for your devices (docs/DEVICES.md)
    volumes:
      - alfred-data:/app/data
      - ./prompts:/app/prompts:ro   # edit the persona without rebuilding
    # run `make web` before building so the image includes the interface
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # NVIDIA GPU: uncomment (needs the NVIDIA container toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  alfred-data:
  ollama-models:
